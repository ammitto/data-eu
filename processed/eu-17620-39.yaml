- whole_name: LLC “KB LIS”
  function: LLC “KB LIS”, also known as the “Hydrangea” Design Bureau, is a Russian
    UAV manufacturer. Its main products are the “Hydrangea” FPV combat drones – Hydrangea-7
    and Hydrangea-10, which have been widely deployed by Russian forces in Ukraine
    since 2022. These systems are mass-produced at a capacity of up to 3 000 units
    per month.
