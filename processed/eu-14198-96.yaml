name_aliases:
- whole_name: Ilya Alekseevich PLESHKOV
  function: As a senior investigator of the Investigation Department for the Moskovsky
    District of Saint-Petersburg, Ilya Pleshkov led the investigation on Oleg Belousov,
    a widower with a dependent adult son with a mental disability, on the politically
    motivated charge of spreading “false information” about the Russian armed forces.
    Oleg Belousov was arrested on 28 June 2022 for publishing anti-war material on
    the VK social media platform. Belousov was sentenced to five-and-a-half years
    in prison and given a four-year ban from posting material on telecommunication
    channels.
