- whole_name: Limited Liability Company Simbirsk Design Bureau “Piranya”
  function: LLC SDB “Piranya” is a Russia-based company that manufactures drones used
    by Russia in its war of aggression against Ukraine. LLC SDB “Piranya” manufactures
    First Person View (FPV) drones and specifically the models “Piranya-7”, “Piranya-10”
    and “Piranya-13”. The company manufactures up to 10 000 drones per month and the
    Russian Army views its products as being extremely valuable in its military operations.
