- whole_name: Yangzhou Yangjie Electronic Technology Co., Ltd.
  function: Yangzhou Yangjie Electronic Technology Co., Ltd. is a leading Chinese
    IDM manufacturer specialising in semiconductor devices used in various industries,
    including automotive, new energy, and consumer electronics. Activities of Yangzhou
    Yangjie Electronic Technology Co., Ltd. include military chips, aerospace and
    defence, military electronics. Yangzhou Yangjie Electronic Technology Company
    Limited has sent over 200 shipments of dual-use technology to Russia since the
    invasion of Ukraine, significantly aiding its military capabilities. The company’s
    products have been found in the drones and ammunition used by Russian troops in
    Ukraine.
