- whole_name: Joint Stock Company Rakurs
  function: |-
    Joint Stock Company Rakurs is a Russian software company and a contractor for the Russian Ministry of Defence.
    Joint Stock Company Rakurs provides topographic data sets and further satellite services through Rakurs photogrammetric software program PHOTOMOD to the Russian Ministry of Defence. PHOTOMOD is the main topographic sensing system used by the Military Topographic Directorate of the General Staff of the Armed Forces of the Russian Federation.
    By materially supporting the General Staff of the Armed Forces of the Russian Federation through the provision of topographic data and satellite services, Joint Stock Company Rakurs  is supporting policies which undermine or threaten the territorial integrity, sovereignty or stability of Ukraine, and supporting the Government of the Russian Federation, which is responsible for the annexation of Crimea and the destabilisation of Ukraine.
