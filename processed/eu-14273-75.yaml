- whole_name: Naser Jalayer SARNAGHI
  function: |-
    Deputy Prosecutor of the First Branch of, and investigator at, the Prosecutor’s Office for Tehran’s District 33 (a.k.a. Evin Prosecution Office)
    Naser Jalayer Sarnaghi is one of the Deputy Prosecutors of the First Branch of the Prosecutor’s Office for Tehran’s District 33 (a.k.a. Evin Prosecution Office), and an investigator at that Prosecution Office. In that role, he has been involved in denying access to a fair trial to, and pressing unfair charges against, political and civil rights activists, in particular women activists, leading to severe punishments, including the death penalty.
    Naser Jalayer Sarnaghi is therefore responsible for severe human rights violations in Iran.
