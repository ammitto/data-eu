- whole_name: Limited Liability Company “Atlant Aero
  function: LLC “Atlant Aero” is a Russian aerospace manufacturer. The company is
    known for its development of “Orion”, “Lightning 1” and “Lightning 1 II” (Molniya)
    first-person view (FPV) drones, which are manually guided for precision strikes.
    LLC “Atlant Aero” contributes to the production of components for advanced combat
    drones “Orion” and is engaged in creating electronic warfare systems and digital
    integration systems for loitering munitions.
