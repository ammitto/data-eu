name_aliases:
- whole_name: Davoud Moazami GOUDARZI
  function: |-
    Davoud Moazami Goudarzi is the Head of Greater Tehran’s Cyber Police, part of Iran’s Cyber Police. The Iranian Cyber Police is a unit of the Iranian Police, and is tasked with policing online activity. It plays a key role in monitoring social media and prosecuting citizens in relation to digital content. It frequently targets dissidents and regime opponents, but also important cultural figures who do not conform to strict social and gender roles, such as female artists. It suppresses freedom of expression and enforces censorship by shutting down social media pages or arresting individuals voicing or promoting opinions not supported by the regime.
    Davoud Moazami Goudarzi is therefore responsible for serious human rights violations in Iran.
