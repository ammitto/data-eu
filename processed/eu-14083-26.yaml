- whole_name: Federal State Budgetary Institution “OK “Snegiri” of the Office of the
    President of the Russian Federation
  function: Federal State Budgetary Institution “OK “Snegiri” is a Russian entity
    that runs a wellness and health centre in the Moscow Region and is owned by the
    Office of the President of the Russian Federation. In cooperation with the Communist
    Party of the Russian Federation, it organises trips where children from illegally
    occupied territories of Ukraine undergo Russian patriotic education and military
    training. Therefore, Federal State Budgetary Institution “OK “Snegiri” is supporting
    and implementing policies contributing to the forced assimilation and militarised
    education of Ukrainian minors.
