- whole_name: SCIENTIFIC-TECHNICAL CENTER FOR ELECTRONIC WARFARE JSC NTC REB
  function: |-
    The Scientific-Technical Center for Electronic Warfare (JSC NTC REB) produces electronic warfare equipment for the Russian military, used on the battlefield against Ukraine. This includes the “Pole-21” and the “Repellent-1” systems.
    Therefore, JSC NTC REB is materially supporting actions which undermine and threaten the territorial integrity, sovereignty and independence of Ukraine. Moreover, it is forming part of Russia’s military and industrial complex, by being involved in the development, production and supply of military technology and equipment.
