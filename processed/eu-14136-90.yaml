- whole_name: Joint-Stock Company “Promsintez”
  function: JSC “Promsintez” is an enterprise of the military and industrial complex
    of the Russian Federation engaged in the production of explosives. The JSC “Promsintez”
    plant produces a wide range of explosives, including TNT, which is directly used
    in the production of ammunition. JSC “Promsintez” therefore forms part of Russia’s
    military and industrial complex.
