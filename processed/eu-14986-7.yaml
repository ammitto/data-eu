name_aliases:
- whole_name: LLC Children's Health Complex "Signal"
  function: |-
    Children's Health Complex "Signal" is a recreational and educational camp, for children aged 7–16. Its primary owner is LLC Gazprom Dobycha Yamburg, a subsidiary of state-owned Gazprom.
    “Signal” hosts children from occupied Donetsk region under Russia-backed initiatives, where minors are exposed to structured educational and patriotic activities. The camp serves as a platform for the state-aligned “Great Russia 2.0” program, which promotes Russian history, culture, loyalty to Russian state-defined values, military and heroic memory.
