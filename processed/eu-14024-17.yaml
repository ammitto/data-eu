- whole_name: Volgaburmash Joint Stock Company
  function: Volgaburmash AO, company based in Samara in the Samara Oblast, is an integral
    part of the Russian oil and gas drilling industry, a sector of strategic importance
    for the Russian Federation and a substantial source of revenue for the Government
    of the Russian Federation. Volgaburmash AO is a leading manufacturer of drill
    bits and machinery for the Russian oil and gas drilling sector and currently holds
    the position of market leader and key supplier within the sector in the Russian
    Federation.
