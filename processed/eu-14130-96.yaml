name_aliases:
- whole_name: Moran Security Group Ltd
  function: Moran Security Group Ltd, registered in both Belize and the Russian Federation,
    is a private maritime security company employing highly trained ex-Russian military
    personnel. Headquartered in Moscow, the firm specialises in protecting cargo vessels,
    primarily oil tankers, from piracy. The company runs a training centre in St.
    Petersburg and functions as a semi-official private military contractor tied to
    Russian government interests, playing a key role in Russia’s privatised military
    activities abroad.
