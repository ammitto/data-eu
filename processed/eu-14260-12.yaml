- whole_name: Seyed Hashem GHIASI
  function: |-
    Seyed Hashem Ghiasi is the Commander of the Imam Reza Islamic Revolutionary Guard Corps, the local branch of the Islamic Revolutionary Guard Corps (IRGC) in Khorasan Razavi Province. Under his command, IRGC and Basij forces in Khorasan Razavi Province have been involved in the violent repression of demonstrations, including during the nationwide protests in Iran that began in December 2025 where IRGC forces opened fire on protesters, resulting in deaths and injuries.
    Seyed Hashem Ghiasi is therefore responsible for serious human rights violations in Iran.
