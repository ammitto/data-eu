- whole_name: Limited Liability Company “Sky Vortex“
  function: LLC “Sky Vortex” is Russia-based distributor of a wide range of certified
    materials from foreign manufacturers for the repair and maintenance of foreign
    aircraft, with approvals from leading aviation companies such as Airbus and Boeing.
    Its client portfolio includes major aviation and aerospace organisations such
    as Russia’s national carrier Aeroflot, Aeroflot Technics, S7 Airlines, Russian
    Helicopters, Composite-Products Company which produces auxiliary materials and
    resins, and A-Technics.
