name_aliases:
- whole_name: Gholam Ali MOHAMMADI
  function: |-
    Gholam Ali Mohammadi is the Head of the Organization for Prisons and Security and Educational Measures of the Islamic Republic of Iran. In that role, he oversees all prisons nationwide. During his tenure, serious human rights violations have been documented throughout Iranian prisons. Such violations include the use of torture or other forms of cruel, inhumane or degrading treatment or punishment, the arbitrary detention and physical abuse of political dissidents and religious minorities, instances of sexual violence and coercion against female prisoners and the abuse and torture of children. Furthermore, Iranian prison authorities under Gholam Ali Mohammadi’s direction have deliberately denied essential medical care to political prisoners, contributing to deaths in custody, and have failed to investigate or provide any accountability for those fatalities.
    Gholam Ali Mohammadi is therefore responsible for serious human rights violations in Iran.
