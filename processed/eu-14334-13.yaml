- whole_name: Limited Liability Company Soglasie Insurance Company
  function: LLC Soglasie Insurance Company is a Russian insurance  company. It is
    an important insurer of vessels shipping Russian  crude oil, thereby facilitating
    and enabling exports to third  countries. The energy sector provides a substantial
    source of  revenue to the Russian Government. Furthermore, LLC Soglasie Insurance
    Company insures vessels transporting Russian crude oil, while practicing irregular
    and high-risk shipping practices as set out in the International Maritime Organisation
    General Assembly resolution A.1192(33).
