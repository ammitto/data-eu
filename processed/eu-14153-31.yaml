name_aliases:
- whole_name: LLP “United Trading Group”
  function: |-
    LLP “United Trading Group” is a Kazakhstan-based company. Its founder and director, Alimzhan Bekov, is a representative of UrSeCo Handels GmbH & Co. KG.
    The German company UrSeCo Handels GmbH & Co. KG supplies high-purity hydrogen chloride (HCl) produced by Wacker Chemie AG, a critical chemical for semiconductor wafer processing, to “United Trading Group”. “United Trading Group” then supplies HCl to the Russian companies LLC “Siltron” and Electronsnab. The supply chain goes through Poland, Türkiye and Kazakhstan. LLC “Siltron” is directly connected to UrSeCo Handels as one of the partners in UrSeCo is the father of the majority shareholder of LLC “Siltron”.
