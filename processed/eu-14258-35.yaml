- whole_name: Mohammad Moazami GOUDARZI
  function: |-
    Mohammad Moazami Goudarzi is Chief of the Preventive Police, Deputy Chief of the Greater Tehran Police and former Police Commander of Karaj and Alborz. In his current and previous positions, he has been directly involved in the violent suppression of protests in Iran. During the December 2025 and January 2026 protests, he was directly responsible for directing relief units, police stations and strike teams on the streets of Tehran.
    Mohammad Moazami Goudarzi is therefore responsible for serious human rights violations in Iran.
