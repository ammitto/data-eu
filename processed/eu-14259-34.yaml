name_aliases:
- whole_name: Yadollah BOUALI
  function: |-
    Yadollah Bouali is the Commander of the Islamic Revolutionary Guard Corps (IRGC) Fajr Corps in Fars Province. Under his command, the IRGC forces in Fars Province have been involved in the violent repression of demonstrations, including during the nationwide protests in Iran that began in December 2025 where IRGC forces opened fire on protesters, resulting in deaths and injuries.
    Yadollah Bouali is therefore responsible for serious human rights violations in Iran.
