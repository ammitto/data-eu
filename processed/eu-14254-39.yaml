name_aliases:
- whole_name: Ali Akbar POUR-JAMSHIDIAN
  function: |-
    Ali Akbar Pour-Jamshidian is a Brigadier General of the Islamic Revolutionary Guard Corps (IRGC) and serves both as Deputy Minister of the Interior for Security and Law Enforcement Affairs and as Secretary of Iran’s National Security Council.
    In those roles, Ali Akbar Pour-Jamshidian has been responsible for the suppression of the street protests that started in December 2025, which has led to hundreds of casualties at the hands of different security forces under his control. He has also participated in the regime’s attempt to obfuscate the reality of the casualties and has expressed his support for the internet shutdown during the protests.
    Ali Akbar Pour-Jamshidian is therefore responsible for serious human rights violations in Iran.
