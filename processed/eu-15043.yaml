designation_date: '2026-10-08'
remark: Olga Alekseevna Belyavtseva is a Russian businesswomen, entrepreneur, and
  owner of companies Agronom-Sad, Biplast, Assol, Everest and Evermount Capital Group.
  Her companies are active in the agriculture, manufacturing, finance, consulting,
  construction and real estate sectors. According to her own words, her company Agronom-Sad
  occupies a leading position in the agricultural sector in Russia and has received
  subsidies from the Russian government.Therefore, Olga Alekseevna Belyavtseva is
  a leading businessperson operating in Russia and a businessperson involved in economic
  sectors providing a substantial source of revenue to the Government of the Russian
  Federation, which is responsible for the annexation of Crimea and the destabilisation
  of Ukraine.
