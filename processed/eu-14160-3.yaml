- whole_name: Limited Liability Company “Gaskar Group”
  function: |-
    LLC “Gaskar Group” is a Russian company specialising in the development and production of unmanned aerial vehicles (UAVs), electronics, and software. Its products include reconnaissance drones Sibiryachok and Siberia-1, widely deployed in military context.
    The company benefits from ties with the Russian government, receiving incentives, such as tax breaks and customs benefits. Gaskar Group’s UAVs training initiatives are integrated into the national Unmanned Aircraft Systems project, approved by the Russian government and backed by President Vladimir Putin. The company has secured major public contracts. In return, Gaskar contributes to state-led modernisation goals by producing UAV technology, and training the workforce.
