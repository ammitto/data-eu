- whole_name: Children's camp "Sunny Beach"
  function: "Children’s Camp “Sunny Beach” is a state educational and recreational
    camp for children aged 7–15, combining recreation, schooling and cultural activities.
    \n“Sunny Beach” hosts children from occupied Ukrainian territories, through recreation,
    rehabilitation, and educational programs organized by Russian regional authorities.
    In the camp, Ukrainian children are exposed to educational environment centred
    on Russian state-approved curricula, patriotic instruction, and ideological messaging."
