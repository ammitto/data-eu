name_aliases:
- whole_name: Aleksei Vasilyevich VALIZER
  function: Aleksei Valizer is the head of Penal Colony 10 UFSIN in Altai Krai. Aleksei
    Gorinov is a prisoner who has been held in that facility since 17 July 2025. Aleksei
    Gorinov was sentenced to six years and 11 months of imprisonment for public dissemination
    of “knowingly false information” about the Russian armed forces and afterwards
    to three years of imprisonment for “public justification of terrorism”. The Memorial
    “Support for Political Prisoners” programme recognised him as a political prisoner.
    While serving a sentence in the penal colony, Gorinov was immediately put in a
    solitary confinement cell, where he was deprived of medical treatment despite
    being previously diagnosed with symptoms of tuberculosis. That punishment was
    automatically extended several times for far-fetched reasons, such as “not holding
    hands behind back” and “placing glasses and letters on the bedside table”. Valizer,
    as the head of the penal colony, is responsible for that facility’s policy towards
    Gorinov.
