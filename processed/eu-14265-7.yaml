- whole_name: Mohammad NASIRI POUR
  function: |-
    Mohammad Nasiri Pour is the Deputy Prosecutor of Tehran and Acting Head of the Prosecutor’s Office for Tehran’s District 33 (a.k.a. Evin Prosecution Office). Furthermore, he is the former supervisor of Evin Court and served there as investigator and sentence enforcement judge.
    In those roles, he participated in prosecutions against civil and social activists, including women’s rights activists, as well as against journalists and political activists critical of the Islamic Republic. In his role working within the Iranian judicial system, he is responsible for fair trial violations such as denying access to a lawyer, inhumane detention conditions, exerting pressure on family members and psychological torture.
    Mohammad Nasiri Pour is therefore responsible for serious human rights violations in Iran.
