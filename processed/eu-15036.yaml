remark: Sergey Bessonov is the general director of LLC AEROMAKS. The company is part
  of the Russian arms industry, which is a sector of strategic importance to the Russian
  Federation.LLC AEROMAKS develops software for drones to perform various aviation
  operations, including aerial photography, collection, processing, and preparation
  of cartographic data and space information. LLC AEROMAKS is also a manufacturer
  of helicopter type drones of SH-3000/-750/-450/-350 and develops 11 types of drones.
  In 2023, the company opened its own Aviation Training Centre approved by the Ministry
  of Labour of the Russian Federation. By the end of 2024, the company had signed
  13 government contracts. Gazprom Neft, Russian Post and Moscow City Department of
  Information Technology were among its customers.Therefore, Sergey Bessonov is materially
  supporting Russia’s military and industrial complex, including by being involved
  in the development, production or supply of military technology and equipment.
