- whole_name: Sergei Vladimirovich FILICHEV
  function: |-
    As a prosecutor of the Lomonosovsky District Court of Saint-Petersburg, Sergei Filichev requested a two-and-a-half-year prison sentence for Dmitry Nikolaevich Skurikhin, an entrepreneur and local politician, on the politically motivated charge of “discrediting” the Russian armed forces. Skurikhin had repeatedly expressed his anti-war and anti-mobilisation sentiments in public.
    Therefore, Sergei Filichev is responsible for serious violations of human rights, in particular the right to freedom of opinion and expression, and for the repression of democratic opposition in Russia.
