name_aliases:
- whole_name: Mohammad Rasulullah Corps
  function: |-
    The Mohammad Rasulullah Corps is responsible for coordinating Islamic Revolutionary Guard Corps (IRGC) and Basij forces in Tehran. Those forces have been involved in the violent repression of demonstrations, including during the nationwide protests in Iran that began in December 2025 where IRGC and Basij forces opened fire on protesters, resulting in deaths and injuries.
    The Mohammad Rasulullah Corps is therefore responsible for serious human rights violations in Iran.
