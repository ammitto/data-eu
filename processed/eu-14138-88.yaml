name_aliases:
- whole_name: JSC ”Kotlin-Novator”
  function: JSC «Kotlin-Novator» is one of the key enterprises in the Russian military
    and industrial complex. It develops, produces and provides services in the area
    of advanced onboard flight navigation systems for military transport airplanes
    and special purpose airplanes. The company is also actively developing collaborations
    with leading Russian aviation companies. It has also started developing and producing
    a dual-use quadcopter “Wind”. Moreover, it has developed a mid-range drone X-89,
    a heavy transport drone “Buran”, as well as a reconnaissance drone EVTOL apparatus
    Y-89.
