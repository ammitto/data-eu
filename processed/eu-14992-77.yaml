- whole_name: Daniella WEISS
  function: Daniella Weiss is the Director of the Nachala Movement (“Nachala”). Nachala
    has the aim of promoting Jewish settlements and illegal outposts in the West Bank.
    Through its activities, Nachala plays an instrumental role in facilitating and
    encouraging coercive acts that lead to the forced displacement of Palestinians
    and violate their right to property, their right to private and family life and
    their right to self-determination, as well as the right to life and to physical
    integrity.
