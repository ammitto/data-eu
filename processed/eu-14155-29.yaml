name_aliases:
- whole_name: JSC Technodron
  function: JSC “Technodron” develops and manufactures first-person view (FPV) drones
    of the Skvorec (a.k.a. Skvorets, Starling) family. With the support of the Center
    for Unmanned Systems and Technologies, this product is constantly being developed
    to expand the range of tasks to be solved. Since 2024, drones Skvorec-7, Skvorec-10,
    Skvorec-Z and Skvorec-PRO have been used by the Russian forces in the Russia’s
    war of aggression against Ukraine. By order of the Russian Navy, the company developed
    the “Starling of the Navy” (Skvorec Navy) for water area related tasks. JSC “Technodron”
    is therefore materially supporting Russia’s military and industrial complex.
