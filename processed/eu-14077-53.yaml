name_aliases:
- whole_name: ETS Solutions (China) Ltd.
  function: |-
    ETS Solutions (China) Ltd. provides advanced vibration testing equipment used across various industries. Its systems are designed to meet international standards, including military-grade specifications such as MIL-STD-810G. ETS Solutions (China) Ltd. sells its products to SCI DIPAUL, an entity listed by the Union for being part of Russia’s military and industrial complex .
    Therefore, ETS Solutions (China) Ltd., is materially supporting and benefitting from Russia’s military and industrial complex by supplying military technologies and equipment.
