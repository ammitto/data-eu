name_aliases:
- whole_name: Anton Vladimirovich RYCHAR
  function: Anton Rychar is the head of Pre-trial Detention Centre 1 UFSIN in the
    Jewish Autonomous Oblast. Pavel Kushnir, a musician with an anti-war stance, was
    held in that facility from May 2024 until his death on 28 July 2025. He was charged
    with “public calls for terrorism” for his statements against the Russian authorities.
    During his imprisonment, he went on a dry hunger strike. According to witnesses’
    testimonies, he lost approximately 10 kilograms and looked like “a skeleton”.
    Other sources stated that Kushnir was beaten in custody by his fellow inmates.
    A witness also saw a bruise on Kushnir’s face. Anton Rychar is responsible for
    the conditions of Kushnir’s incarceration, which led to his death due to insufficient
    medical treatment.
