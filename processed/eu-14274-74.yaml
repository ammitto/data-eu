- whole_name: Mahmoud Haj MORADI
  function: |-
    Mahmoud Haj Moradi is an investigator at the Prosecutor’s Office for Tehran’s District 33 (a.k.a. Evin Prosecution Office).
    In that role, he has participated in the wrongful prosecution of women. He has played a role in filing cases against civil and social activists, as well as against journalists and political activists critical of the Islamic Republic. In doing so, Haj Moradi has violated the right to freedom of expression and the right to a fair trial.
    Mahmoud Haj Moradi is therefore responsible for serious human rights violations in Iran.
