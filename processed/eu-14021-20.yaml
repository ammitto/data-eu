- whole_name: Limited Liability Company “Irz-Svyaz”
  function: LLC “Irz-Svyaz” is a Russian manufacturer of communication systems that
    perform the function of switching, mostly for navigation receivers. LLC “Irz-Svyaz”
    has licenses for production and repair of weapons and military equipment, and
    the company supplies components to the military-industrial complex of the Russian
    Federation, as its manufactured products are used in UAV’s “Orlan-10” and “Tachion”,
    used by Russian armed forces in Ukraine. LLC “Irz-Svyaz” also sells its manufactured
    goods to Russian military and industrial complex companies, such as JSC “Votokinsk
    Plant”, a known manufacturer of Iskander-M ballistic missiles.
