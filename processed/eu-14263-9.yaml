name_aliases:
- whole_name: Seyed Qasim QURESHI
  function: |-
    Seyed Ghassem Qureshi is the Deputy Commander of the Basij Forces, a paramilitary branch of the Islamic Revolutionary Guard Corps (IRGC). He has a long career within the IRGC dating back to the Iran-Iraq war. He served as the Commander of the Basij Resistance Organization in Qom from 1999 to 2002 and as Deputy Inspector of the Basij Resistance Forces from 2002 to 2006.
    In his current position, Seyed Ghassem Qureshi commands an organisation accused of systematic human rights violations, including the brutal suppression of protests. Basij forces have repeatedly been accused of using firearms, severe beatings and intentionally killing protestors during protest crackdowns, including the recent protests starting in December 2025.
    Seyed Ghassem Qureshi is therefore responsible for serious human rights violations in Iran.
