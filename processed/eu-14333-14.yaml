name_aliases:
- whole_name: Raw Materials Cellulose LLC
  function: Raw Materials Cellulose LLC is an Uzbek company producing cotton pulp.
    Raw Materials Cellulose LLC supplies cotton pulp to Russian military-industrial
    companies, including the FSE Tambov Gunpowder Plant, which use it to produce gunpowder.
    Therefore, Raw Materials Cellulose LLC is supporting Russia’s military and industrial
    complex by being involved in supply of military technology and equipment.
