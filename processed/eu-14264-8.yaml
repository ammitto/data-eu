name_aliases:
- whole_name: Ahmad BIGDELI
  function: |-
    Ahmad Bigdeli is the Deputy Head of Operations at the Sarallah headquarters of the Islamic Revolutionary Guard Corps (IRGC). The Sarallah headquarters play a crucial role in coordinating security operations of IRGC ground forces, Basij forces and other units. Those forces were key actors in the regime’s violent repression of the recent protests starting in December 2025. Bigdeli’s responsibilities include conducting training exercises and overseeing field operations.
    Ahmad Bigdeli is therefore responsible for serious human rights violations in Iran
