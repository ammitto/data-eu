remark: Ramil Badgutdinov is the general director of JSC Serpukhov Plant Metallist.
  The company is part of the Russian arms industry, which is a sector of strategic
  importance to the Russian Federation.JSC Serpukhov Plant Metallist produces gyro
  motors, gyro units and various precision electromechanical sensors and devices.
  The company is involved in the manufacture of the navigation system 9B918 for the
  ballistic missile 9M723 Iskander-M, used by Russian forces in Russia’s war of aggression
  against Ukraine.Therefore, Ramil Badgutdinov is materially supporting Russia’s military
  and industrial complex, including by being involved in the development, production
  or supply of military technology and equipment.
