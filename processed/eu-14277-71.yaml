name_aliases:
- whole_name: Naji Research and Development Company (NRDC)
  function: |-
    Naji Research and Development Company (NRDC) is an Iranian IT-services and consultancy company that is responsible for developing the Nazer mobile application for Iran’s Law Enforcement Forces.
    The Nazer mobile application is used as a surveillance tool to monitor and control citizens in Iran. It enables state-vetted individuals to report other individuals for hijab violations and for behaviour that goes against public morality. Individuals reported through the Nazer mobile application could be subjected to criminal trials and punishments, including fines, imprisonment and lashings.
    The NRDC is therefore responsible for serious human rights violations in Iran.
