- whole_name: Andrey Pavlovich SHIBAKOV
  function: |-
    As the judge of the Lomonosovsky District Court of Saint-Petersburg, Andrey Shibakov sentenced Dmitry Nikolaevich Skurikhin, an entrepreneur and a local politician, to one-and-a-half years in prison on the politically motivated charge of “discrediting” the Russian armed forces. Skurikhin had repeatedly expressed his anti-war and anti-mobilisation sentiments in public.
    Therefore, Andrey Shibakov is responsible for serious violations of human rights, in particular the right to freedom of opinion and expression, and for the repression of civil society and democratic opposition in Russia.
