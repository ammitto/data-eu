name_aliases:
- whole_name: Al Houda Holding Limited
  function: 'Al Houda Holding is the registered owner of the San Damian (IMO  9274331,
    formerly known as the Souria), a vessel listed by the Union which is used to transport
    stolen Ukrainian grain. In 2023, Al Houda Holding bought three vessels listed
    by the Union: the Finikia (IMO: 9385233), the Laodicea (IMO: 9274343), and the
    Souria aka San Damian (IMO: 9274331). To transport Ukrainian grain, these vessels
    obscure their actions by carrying false flags and practicing irregular and high-risk
    shipping practices. The systematic plunder of Ukrainian grain on Russian-occupied
    territories is a Russian state policy to strip Ukraine of essential agricultural
    produce and income. Therefore, Al Houda Holding is responsible for and supporting
    actions or policies which undermine or threaten the territorial integrity, sovereignty
    and independence of Ukraine, and stability and security in Ukraine'
