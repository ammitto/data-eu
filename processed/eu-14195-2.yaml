- whole_name: Vyacheslav Nikolaevich PISKLOV
  function: Vyacheslav Pisklov is the head of Penal Colony 9 UFSIN in Altai Krai.
    Maria Ponomarenko is a prisoner who is being held in that facility. On 15 February
    2023, she was sentenced to six years of imprisonment on the charge of spreading
    “false information” about the Russian armed forces. In March 2025, while she was
    incarcerated, she was sentenced to 22 additional months in prison for allegedly
    using violence against prison staff. The Memorial “Support for Political Prisoners”
    programme recognised her as a political prisoner. While serving a sentence in
    the penal colony, Ponomarenko was mistreated, including by being repeatedly put
    in a solitary confinement in harsh conditions for far-fetched reasons and being
    deprived of medical treatment. This has led to her breakdown and subsequently
    three suicide attempts, two of which took place in the penal colony. Pisklov,
    as the head of the penal colony, is responsible for that facility’s policy towards
    Ponomarenko.
