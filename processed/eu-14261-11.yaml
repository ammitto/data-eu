- whole_name: Ahmad DARVISH GOFTAR
  function: |-
    Ahmad Darvish Goftar is the Head of the Revolutionary Court of Rasht and President of that court’s First Branch. In that role he is responsible for serious human rights violations, in particular forced confessions, violations of fair trial guarantees and the issuance of severe or death sentences against activists.
    Ahmad Darvish Goftar is therefore responsible for serious human rights violations in Iran.
