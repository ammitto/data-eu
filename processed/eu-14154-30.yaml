- whole_name: Limited Liability Company 10th Bearing Plant
  function: |-
    Limited Liability Company “10th Bearing Plant” specialises in the production of bearings for trucks, cars and special vehicles, including for the needs of enterprises of the military industry of the Russian Federation. The company supplies its bearings to Russian military industry companies, including KAMAZ and UralAZ.
