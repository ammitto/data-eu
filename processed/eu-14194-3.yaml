- whole_name: Maksim Aleksandrovich PRILEPSKY
  function: Maksim Prilepsky is the head of Penal Colony 5 UFSIN in the Oryol Oblast.
    Mikhail Kriger is a prisoner held in that facility. On 17 May 2023, he was sentenced
    to seven years of imprisonment on politically motivated charges of “public justification
    of terrorism” and “public incitement to hatred and enmity against a social group
    with the threat of violence”. The Memorial “Support for Political Prisoners” programme
    recognised him as a political prisoner. While serving his sentence in the penal
    colony, Kriger was repeatedly put in a solitary confinement in harsh conditions
    for allegedly being threatened by other inmates. However, according to human rights
    defenders and Kriger, it was a far-fetched reason and the isolation was motivated
    by the political nature of his case. Kriger was put in solitary confinement for
    a period of 90 days and was not allowed to have visits from relatives or to receive
    letters from outside the penal colony. As a consequence, Kriger went on a hunger
    strike for 51 days.
