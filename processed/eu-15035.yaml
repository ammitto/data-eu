remark: Sergey Bashkov is the director of Limited Liability Company (LLC) Irz-Svyaz.
  The company is part of the Russian arms industry, which is a sector of strategic
  importance to the Russian Federation.LLC Irz-Svyaz is a Russian manufacturer of
  communication systems that perform the function of switching, mostly for navigation
  receivers. LLC Irz-Svyaz has licenses for production and repair of weapons and military
  equipment. The company also supplies components to the military and industrial complex
  of the Russian Federation, as its manufactured products are used in UAV’s Orlan-10
  and Tachion, which are used by Russian armed forces in Ukraine. LLC Irz-Svyaz also
  sells its manufactured goods to Russian military and industrial complex companies,
  such as JSC Votokinsk Plant, a known manufacturer of Iskander-M ballistic missiles.
  Moreover, LLC Irz-Svyaz is a systemically important company in Russia in the field
  of manufacturing navigation receivers for GPS and for GLONASS, which is a Russian
  satellite navigation system designed for operational navigation and time support
  for an unlimited number of land, sea, air and space-based users.Therefore, Sergey
  Bashkov is materially supporting Russia’s military and industrial complex, including
  by being involved in the development, production or supply of military technology
  and equipment.
