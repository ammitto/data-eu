- whole_name: Imam Reza Islamic Revolutionary Guard Corps
  function: |-
    The Imam Reza Islamic Revolutionary Guard Corps is the local branch of the Islamic Revolutionary Guard Corps (IRGC) in Khorasan Razavi Province, and therefore commands IRGC and Basij forces in Khorasan Razavi Province. Those forces have been involved in the violent repression of demonstrations, including during the nationwide protests in Iran that began in December 2025 where IRGC forces opened fire on protesters, resulting in deaths and injuries.
    The Imam Reza Islamic Revolutionary Guard Corps is therefore responsible for serious human rights violations in Iran.
