- whole_name: FSBI “DOP ‘Raduga’”
  function: "The FSBI “DOP Raduga” in occupied Crimea is a state-run children’s summer
    camp for children aged 7–16, operating four 21-day summer sessions. \n“Raduga”
    hosts children from occupied Ukrainian territories under programs funded by Russian
    regional authorities. Children are exposed to political indoctrination, propaganda-cultural
    activities, and programs designed to foster loyalty to Russia."
