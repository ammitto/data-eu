name_aliases:
- whole_name: EVA Alexandrovna GIUNTER
  function: As the judge of the Moskovsky District Court of Saint-Petersburg, EVA
    Giunter sentenced Oleg Vasilievich Belousov, a widower with a dependent adult
    son with a mental disability, to five-and-a-half years in prison on politically
    motivated charges of spreading “false information” about the Russian armed forces
    and for “public calls for extremism”. Giunter also prohibited Belousov from posting
    material on telecommunication networks, including the internet, for four years.
    Oleg Belousov was arrested on 28 June 2022 for publishing anti-war material on
    the VK social media platform.
