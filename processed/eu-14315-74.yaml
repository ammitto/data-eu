name_aliases:
- whole_name: Centauri Services LLC
  function: Centauri Services LLC is a UAE-based shipping company, which owns and
    manages tankers transporting Russian crude oil, including for export purposes.Various
    tankers owned by Centauri Services LLC are part of the so-called “shadow fleet”
    and are involved in high-risk shipping practices, while transporting crude oil
    or petroleum products, originating in Russia or exported from Russia. Such practices
    include not maintaining adequate liability insurance, carrying out unsafe operations,
    intentionally taking measures to avoid ship detection or not operating under a
    transparent corporate governance policy. Therefore, Centauri Services LLC owns
    and manages vessels that transport crude oil or petroleum products, originating
    in Russia or exported from Russia, while practicing irregular and high-risk shipping
    practices as set out in the International Maritime Organisation General Assembly
    resolution A.1192(33).
