remark: Aleksandr Dyukarev is the general director of Joint Stock Company (JSC) Krasnoyarsk
  Machine-Building Plant. The company is part of the Russian arms industry, which
  is a sector of strategic importance to the Russian Federation.JSC Krasnoyarsk Machine-Building
  Plant is a Russian machine-building company. One of the activities of JSC Krasnoyarsk
  Machine-Building Plant is the production of ballistic missiles and modules for carrier
  rockets. JSC Krasnoyarsk Machine-Building Plant produces the ballistic missile RS-28
  Sarmat.Therefore, Aleksandr Dyukarev is materially supporting Russia’s military
  and industrial complex, including by being involved in the development, production
  or supply of military technology and equipment.
