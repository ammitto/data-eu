- whole_name: JSC "SCIENTIFIC AND PRODUCTION ASSOCIATION” "ANDROID TECHNOLOGY"
  function: |-
    JSC "Scientific and Production Association” "Android Technology” develops and manufactures unmanned ground-based robots and unmanned aerial vehicles. One of them is an unmanned reconnaissance and strike vehicle “Marker”. The first 4 robots of this type were deployed to the front in Donbas in 2023. Moreover, the company has also developed a special drone “BAS-80” to be fitted on the robot “Marker” that also was planned to become operational in the combat zone.
    Among the company’s main partners are Roskosmos, Rosatom, Pirogov Russian National Research Medical University, and the Institute of Higher Nervous Activity and Neurophysiology of the Russian Academy of Science. The company participates in the work of the interdepartmental working group “Robotics Laboratory” at the Military-Industrial Commission of the Russian Federation.
