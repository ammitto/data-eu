    financing and facilitating at least 30 violent outposts and settlements, including
    outposts founded by individuals listed by the European Union (Yinon Levi, founder
    of the Mitarim Farm Outpost; Moshe Sharvit, founder of the Tirza Valley Farm Outpost
    / Moshe’s Farm; and Isaschar Manne, founder of the Manne Farm outpost) in the
    occupied West Bank.
