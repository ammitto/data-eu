- whole_name: Limited Liability Company “Vremya-Ch”
  function: |-
    Vremya-Ch is a military training centre in Moscow that provides military-style education and preparedness programs for law enforcement and military personnel. Its courses cover Unmanned Air Vehicle (UAV) operation, military radio communications, survival skills.
    Vremya-Ch has ties with Russia’s military and industrial complex and plays a direct role in the country’s war against Ukraine. The centre was acknowledged by Russia’s Ministry of Defence, and individual military units, for contribution to military training in the context of the so-called “special military operation”. Its courses prepare soldiers for combat, including UAV operation, battlefield communications, and mine avoidance. The centre also organises material and logistical support for Russian forces, delivering UAVs, electronics and optics to units at the front, operating across Russia and Russian-occupied territories of Ukraine.
