- whole_name: Limited Liability Company SKB Stankostroenie
  function: |-
    LLC SKB STANKOSTROENIE produces metalworking equipment, including CNC lathes and milling machines, multifunctional machining centres, such as 400V metalworking and cutting tools. The entity sells its products to various Russian enterprises, including ODK-UMPO (PJSC UEC-UMPO), the main producers of turbojet aircraft engines: Su-27 family aircraft (AL-31F engine), Su-30 (engines AL-31F and AL-31FP), Su-25 (R-95Sh and R-195), Su-35S (AL-41F-1S), Su-57 (AL-41F-1).
    Therefore, LLC SKB STANKOSTROENIE is materially supporting and benefitting from Russia’s military and industrial complex by supplying military technologies and equipment.
